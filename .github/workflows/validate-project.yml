name: Validate TRADE AR MONEY source
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'supabase/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/validate-project.yml'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check website HTML and inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          class CheckHTML(HTMLParser):
              def error(self, message):
                  raise RuntimeError(message)

          files = sorted(Path("website").glob("*.html"))
          for path in files:
              source = path.read_text(encoding="utf-8")
              parser = CheckHTML(convert_charrefs=True)
              parser.feed(source)
              parser.close()
              scripts = re.findall(r"<script(?![^>]*\bsrc=)[^>]*>(.*?)</script\s*>", source, re.I | re.S)
              for index, script in enumerate(scripts):
                  if not script.strip():
                      continue
                  temp = Path(tempfile.gettempdir()) / f"{path.stem}-{index}.js"
                  temp.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(temp)], check=True)
              print(f"HTML parsed; inline JS syntax checked: {path}")

          schema = Path("supabase/schema.sql").read_text(encoding="utf-8").lower()
          required = [
              "enable row level security",
              "create or replace function public.is_admin()",
              "using(public.is_admin()) with check(public.is_admin())",
              "create policy \"users can create own user profile\"",
              "role='user'",
              "device_push_tokens",
              'drop policy if exists "users can read audience notifications" on public.app_notifications;\ncreate policy "users can read audience notifications"',
          ]
          missing = [term for term in required if term not in schema]
          if missing:
              raise SystemExit("Schema safety check failed; missing: " + ", ".join(missing))
          if "service_role" in Path("lib/main.dart").read_text(encoding="utf-8").lower():
              raise SystemExit("Do not put a Supabase service-role key in the Flutter client.")
          print("Schema access-control markers checked; no service-role reference in Flutter client.")
          PY

      - name: Check public-site and admin safety guardrails
        run: |
          python - <<'PY'
          from pathlib import Path

          site = Path("website/index.html").read_text(encoding="utf-8")
          admin = Path("website/admin.html").read_text(encoding="utf-8")
          push = Path("supabase/functions/send-push/index.ts").read_text(encoding="utf-8")
          feed = Path("supabase/functions/arg-v1-results/index.ts").read_text(encoding="utf-8")
          schema = Path("supabase/schema.sql").read_text(encoding="utf-8").lower()
          app = Path("lib/main.dart").read_text(encoding="utf-8")

          checks = {
              "public content is HTML-escaped": "const safe=s=>String(s??'').replace" in site,
              "website login accepts existing password lengths": 'id="password" type="password" autocomplete="current-password" required' in site and 'id="password" type="password" minlength="8"' not in site,
              "website login explains common authentication errors": "invalid login credentials" in site.lower() and "email not confirmed" in site.lower() and "too many attempts" in site.lower(),
              "Flutter login only requires a non-empty existing password": "validator:(v)=>(v??'').isEmpty?'Password लिखें।':null" in app,
              "Flutter signup enforces eight-character password": "if(signup && p.length<8)" in app,
              "Flutter auth errors give actionable guidance": "invalid login credentials" in app.lower() and "email not confirmed" in app.lower() and "too many requests" in app.lower(),
              "public auth refresh is deferred": "db.auth.onAuthStateChange(()=>{setTimeout(" in site,
              "practice mode is clearly labeled": "Practice only: this does not connect to Mark Pro" in site,
              "website timer uses local minute boundaries": "const argPeriodId=now=>" in site and "argRemaining=60-argNow.getSeconds()" in site,
              "website resets practice choice on period change": "if(nextRound!==argRound)" in site and "arg-choice" in site,
              "Flutter timer uses readable local period ID": "String round=_localPeriodId(DateTime.now())" in app and "static String _localPeriodId(DateTime time)" in app,
              "Flutter timer clears selection when period changes": "selected=null;" in app and "final currentRound=_localPeriodId(now);" in app,
              "Auto Bet practice round timer exists": "Timer.periodic(const Duration(seconds: 1)" in app and "roundSecondsRemaining = 60;" in app,
              "Auto Bet prevents duplicate outcomes per round": "outcomeLoggedThisRound" in app and "if (!running || stopped || outcomeLoggedThisRound) return;" in app,
              "ARG V1 recent pattern analysis is visible": "RECENT PATTERN ANALYSIS" in app and "Descriptive sample lean" in app,
              "ARG V1 pattern analysis discloses uncertainty": "does not establish the next outcome" in app and "need at least 10 classified results" in app,
              "Auto Bet remains practice-only": "PRACTICE SIMULATOR ONLY" in app and "bet submit नहीं करती" in app,
              "ARG V1 protected feed requires sign-in": "if (Supabase.instance.client.auth.currentUser == null)" in app and "liveError =" in app,
              "public page discloses no live results API": "No live results API is connected" in site,
              "admin role is checked from profile": "p.data?.role==='admin'" in admin,
              "admin tools hidden without authorization": "$('tools').hidden=!admin" in admin,
              "admin writes are described as RLS protected": "Database row-level security is enforced on every write" in admin,
              "admin save handles network failures": "Save failed because the request could not reach Supabase." in admin,
              "admin save exits saving state on database errors": "Save failed: " in admin and "if(error){" in admin,
              "website does not contain a service-role key label": "service_role" not in site.lower(),
              "push endpoint requires authenticated user": 'const { data: userData, error: userError } = await db.auth.getUser();' in push,
              "push endpoint enforces admin authorization": 'if (roleError || isAdmin !== true)' in push,
              "push payload rejects non-string fields": 'typeof payload.title !== "string" || typeof payload.body !== "string"' in push,
              "push credentials are read server-side": 'Deno.env.get("FCM_SERVICE_ACCOUNT_JSON")' in push and 'Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")' in push,
              "push endpoint rejects methods other than POST": 'if (req.method !== "POST") return response({ error: "POST required" }, 405);' in push,
              "push title and body lengths are capped": '.trim().slice(0, 100)' in push and '.trim().slice(0, 500)' in push,
              "push endpoint reads enabled tokens with a bounded query": '.from("device_push_tokens").select("token").eq("enabled", true).limit(500)' in push,
              "push errors do not return raw provider responses": 'FCM send failed. Verify the server-side Firebase service-account secret.' in push and 'return response({ error: tokenError.message' not in push,
              "results adapter accepts GET only": 'if (req.method !== "GET")' in feed,
              "results adapter requires HTTPS": 'parsedUrl.protocol !== "https:"' in feed,
              "results adapter enforces exact hostname allowlist": 'allowedHosts.includes(parsedUrl.hostname.toLowerCase())' in feed,
              "results adapter blocks upstream redirects": 'redirect: "error"' in feed,
              "results adapter has an upstream timeout": 'setTimeout(() => controller.abort(), 8000)' in feed,
              "results adapter bounds upstream response size": 'readBoundedBody(upstream, 1_000_000)' in feed,
              "results adapter limits returned rows": 'rawRows.slice(0, 100)' in feed,
              "results adapter rejects embedded URL credentials": 'parsedUrl.username || parsedUrl.password' in feed,
              "results adapter only forwards a configured server-side provider token": 'Deno.env.get("ARG_V1_RESULTS_API_KEY")' in feed and 'headers.set("Authorization", `Bearer ${upstreamKey}`)' in feed,
              "results adapter normalizes only recognized BIG/SMALL values": 'size === "BIG" || size === "SMALL" ? size : null' in feed,
              "results adapter filters rows without period or number": '.filter((row) => row.period !== null && row.number !== null)' in feed,
              "results adapter returns a non-cacheable private freshness window": '"Cache-Control": "private, max-age=15"' in feed,
              "results adapter fails closed when source is missing": 'if (!upstreamUrl)' in feed and '"results_source_not_configured"' in feed,
              "results adapter does not expose bet or payment operations": all(term not in feed.lower() for term in ['place bet', '/deposit', '/withdraw', 'payment verification']),
              "push endpoint uses authenticated JWT for role check": 'global: { headers: { Authorization: authorization } }' in push,
              "result history writes require admin": 'create policy "admins can manage result history" on public.result_history for all to authenticated using(public.is_admin()) with check(public.is_admin());' in schema,
              "article writes require admin": 'create policy "admins can manage learning articles" on public.learning_articles for all to authenticated using(public.is_admin()) with check(public.is_admin());' in schema,
              "notification writes require admin": 'create policy "admins can manage notifications" on public.app_notifications for all to authenticated using(public.is_admin()) with check(public.is_admin());' in schema,
          }
          failed = [label for label, ok in checks.items() if not ok]
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)
          if failed:
              raise SystemExit("Safety guardrail checks failed: " + ", ".join(failed))
          PY
