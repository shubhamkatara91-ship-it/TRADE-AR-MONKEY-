name: Build TRADE AR MONEY APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
concurrency:
  group: trade-ar-money-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android --org com.tradearmoney --project-name trade_ar_money build_scaffold
      - name: Copy app source
        run: |
          cp -R lib build_scaffold/
          cp pubspec.yaml build_scaffold/
          sed -i 's/android:label="[^"]*"/android:label="TRADE AR MONEY"/' build_scaffold/android/app/src/main/AndroidManifest.xml
      - name: Resolve dependencies
        working-directory: build_scaffold
        run: flutter pub get
      - name: Build release APK
        working-directory: build_scaffold
        run: flutter build apk --release
      - name: Prepare release bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p release_bundle
          cp build_scaffold/build/app/outputs/flutter-apk/app-release.apk release_bundle/TRADE-AR-MONEY.apk
          printf 'TRADE AR MONEY Android build\nCommit: %s\nGitHub Actions run: %s\nBuilt at (UTC): %s\n\nThis is a CI-compiled APK. Production signing, backend setup, and physical-device acceptance testing are not certified by this build.\n' "$SOURCE_SHA" "$RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release_bundle/BUILD_INFO.txt
          cd release_bundle
          sha256sum TRADE-AR-MONEY.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TRADE-AR-MONEY-release-apk-latest
          path: release_bundle/
          if-no-files-found: error
